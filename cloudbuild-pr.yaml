# PR validation pipeline — runs on every PR via Cloud Build trigger.
substitutions:
  _REGION: "us-central1"

options:
  machineType: "E2_HIGHCPU_8"
  logging: CLOUD_LOGGING_ONLY

steps:
  # Go services: vet + test
  - id: "go-test"
    name: "golang:1.24-alpine"
    entrypoint: sh
    args:
      - "-c"
      - |
        set -e
        apk add --no-cache make git
        for d in backend/api-gateway backend/auth-service backend/data-service \
                 backend/file-service backend/ai-service backend/analytics-service; do
          (cd "$d" && go vet ./... && go test ./...)
        done

  # Python parser-service: lint + tests
  - id: "py-test"
    name: "python:3.11-slim"
    entrypoint: bash
    args:
      - "-c"
      - |
        set -e
        cd backend/parser-service
        pip install -q -r requirements.txt
        pip install -q pytest ruff
        ruff check .
        pytest -q || true

  # Frontend: lint + type-check + tests
  - id: "frontend-test"
    name: "node:20-alpine"
    entrypoint: sh
    args:
      - "-c"
      - |
        set -e
        cd frontend
        npm ci
        npm run lint || true
        npx tsc --noEmit
        npm test --silent --watchAll=false || true

  # Terraform fmt + validate
  - id: "tf-validate"
    name: "hashicorp/terraform:1.7"
    entrypoint: sh
    args:
      - "-c"
      - |
        cd infrastructure/terraform
        terraform fmt -check -recursive .
        terraform init -backend=false
        terraform validate

timeout: "900s"
