# NOTE: For production use Cloud SQL (managed PostgreSQL on GCP) instead of this.
# This manifest is for development/testing on GKE only.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: enterprise-portal
  labels:
    app: portal-postgres
spec:
  serviceName: portal-postgres
  replicas: 1
  selector:
    matchLabels:
      app: portal-postgres
  template:
    metadata:
      labels:
        app: portal-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: enterprise_portal
            - name: POSTGRES_USER
              value: portal_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: portal-secrets
                  key: DB_PASSWORD
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits:   { cpu: "2000m", memory: "2Gi" }
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: portal-postgres
  namespace: enterprise-portal
spec:
  selector:
    app: portal-postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
