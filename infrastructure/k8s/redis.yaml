apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-redis
  namespace: enterprise-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portal-redis
  template:
    metadata:
      labels:
        app: portal-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          args: ["--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: portal-redis
  namespace: enterprise-portal
spec:
  selector:
    app: portal-redis
  ports:
    - port: 6379
      targetPort: 6379
