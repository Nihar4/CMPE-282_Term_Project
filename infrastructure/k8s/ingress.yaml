# GKE Ingress with Google-managed SSL and Cloud Armor
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portal-ingress
  namespace: enterprise-portal
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.allow-http: "false"
    networking.gke.io/managed-certificates: "portal-ssl-cert"
    networking.gke.io/v1beta1.FrontendConfig: "portal-frontend-config"
    # Cloud Armor WAF policy
    compute.googleapis.com/security-policy: "enterprise-portal-armor"
spec:
  rules:
    - host: portal.yourdomain.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: portal-ssl-cert
  namespace: enterprise-portal
spec:
  domains:
    - portal.yourdomain.com
---
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: portal-frontend-config
  namespace: enterprise-portal
spec:
  redirectToHttps:
    enabled: true
    responseCodeName: MOVED_PERMANENTLY_DEFAULT
  sslPolicy: portal-ssl-policy
